[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ascii-foundry"
version = "0.1.0"
description = "Desktop and CLI tools for converting images and videos into ASCII art."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "ASCII Foundry Contributors" }
]
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "platformdirs>=4.0",
]

[project.optional-dependencies]
gui = [
  "PySide6>=6.6",
]
video = [
  "opencv-python>=4.8",
  "yt-dlp>=2024.8.6",
]
dev = [
  "pytest>=8.0",
]
build = [
  "pyinstaller>=6.10",
]

[project.scripts]
ascii-foundry = "ascii_foundry.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
